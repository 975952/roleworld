name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Windows）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # adapter-unit 不需要浏览器；local-app-check 需要一个 Chromium。
      # windows-latest 自带 Google Chrome，先用它；万一没有就用 setup-chrome 兜底。
      - name: 探测浏览器
        id: chrome
        shell: bash
        run: |
          if [ -f "/c/Program Files/Google/Chrome/Application/chrome.exe" ]; then
            echo "found=system" >> "$GITHUB_OUTPUT"
          else
            echo "found=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Chrome（系统没有时）
        if: steps.chrome.outputs.found == 'missing'
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: 单元测试（适配层）
        run: node tests/adapter-unit.cjs

      - name: 端到端测试（无头浏览器 + 假模型端点）
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node tests/local-app-check.cjs
