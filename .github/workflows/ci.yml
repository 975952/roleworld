name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # adapter-unit 不需要浏览器；local-app-check 需要 Chrome。
      # ubuntu-latest 与 windows-latest 都自带 Google Chrome，先探测一下，
      # 找不到就显式装一个（用 setup-chrome 提供 CHROME_PATH）。
      - name: 探测浏览器
        id: chrome
        shell: bash
        run: |
          if [ -x "/usr/bin/google-chrome" ] || [ -x "/usr/bin/google-chrome-stable" ]; then
            echo "found=system" >> "$GITHUB_OUTPUT"
          elif [ -f "/c/Program Files/Google/Chrome/Application/chrome.exe" ]; then
            echo "found=system" >> "$GITHUB_OUTPUT"
          else
            echo "found=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 Chrome（系统没有时）
        if: steps.chrome.outputs.found == 'missing'
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: 单元测试（适配层）
        run: node tests/adapter-unit.cjs

      - name: 端到端测试（无头浏览器 + 假模型端点）
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node tests/local-app-check.cjs
