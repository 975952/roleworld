name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: 打包（${{ matrix.platform }} ${{ matrix.args }}）
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            # 只出 NSIS 安装包。MSI 要经过 WiX 3 的 light.exe，它在中文产品名
            # （角色世界）上会直接失败：failed to run ...\WixTools314\light.exe。
            # NSIS 对中文路径/名称没有问题。
            args: "--bundles nsis"
          # 只发 Windows。想加回其它平台，取消下面的注释即可
          # （macOS 需要签名证书才能让用户无警告打开，Linux 各发行版依赖差异较大）。
          # - platform: ubuntu-22.04
          #   args: ""
          # - platform: macos-latest
          #   args: "--target aarch64-apple-darwin"
          # - platform: macos-latest
          #   args: "--target x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 必须显式装 pnpm：tauri-action 看到仓库里有 pnpm-lock.yaml 就会去调
      # `pnpm tauri build`，runner 上没有 pnpm 会直接 'pnpm' is not recognized。
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri 在 Linux 上依赖 WebKitGTK 与 appindicator。
      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 打包并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "角色世界 ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            本地优先的开源角色对话应用：没有服务器，没有账号，没有遥测。
            角色卡、对话记录、记忆书、API Key 全部只存在你自己的设备上。

            ### 下载

            | 平台 | 文件 |
            |---|---|
            | Windows 10/11 (x64) | `RoleWorld_x.y.z_x64-setup.exe` |

            安装包未做代码签名，SmartScreen 可能提示"未知发布者"，选「更多信息 → 仍要运行」即可。
            macOS / Linux 暂未提供构建（Tauri 配置里已留好，见 `.github/workflows/release.yml`）。

            ### 第一次打开

            1. 「设置 → 模型」选服务商（DeepSeek 官方 / OpenAI / OpenRouter / 硅基流动 / 自定义），
               填接口地址与 API Key，点「测试连接」；
            2. 回到对话页，内置内容包会自动装好 6 个角色和 4 本记忆书；
            3. 也可以换成自己的模型：地址填本地推理服务（llama.cpp / Ollama / LM Studio 的
               `/v1/chat/completions`），Key 留空。

            ### 数据在哪

            全部是磁盘上的普通文件，可直接备份、编辑、用 Git 管理：

            `%APPDATA%\app.roleworld.desktop\data\`

            ### 内置内容包说明

            `packs/harry-potter` 是同人二次创作，仅供个人非商业使用，版权归原作者及权利方所有，
            与本项目无关联。不想要它：删掉该目录即可，应用会以空书架启动。

            MIT License。
