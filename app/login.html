<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="角色世界 · 安全登录与注册">
  <title>角色世界 · 账户入口</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --ink:#f8f3e8; --muted:#b9b3bc; --gold:#e9c77d; --panel:rgba(22,20,35,.88); --line:rgba(234,203,135,.25); --danger:#ffafa8; --success:#b5e2bc; }
    * { box-sizing:border-box; } body { min-width:320px; margin:0; min-height:100vh; overflow-x:hidden; color:var(--ink); background:#0d0c16; }
    body::before { content:""; position:fixed; z-index:-2; inset:0; background:radial-gradient(circle at 16% 12%,rgba(229,181,85,.18),transparent 30rem),radial-gradient(circle at 84% 88%,rgba(104,88,182,.28),transparent 32rem),linear-gradient(135deg,#111020 0%,#0c0b14 54%,#171126 100%); }
    body::after { content:""; position:fixed; z-index:-1; inset:0; opacity:.22; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.6) .55px,transparent .7px); background-size:11px 11px; mask-image:linear-gradient(90deg,rgba(0,0,0,.8),transparent 72%); }
    .shell { width:min(1180px,100%); min-height:100vh; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(390px,.9fr); align-items:center; gap:clamp(36px,7vw,112px); margin:0 auto; padding:44px clamp(24px,5vw,76px); }
    .welcome { max-width:570px; padding:20px 0; }.brand { display:inline-flex; align-items:center; gap:12px; color:#f2d38e; font-size:12px; font-weight:750; letter-spacing:.18em; }.brand-mark { width:34px; height:34px; display:grid; place-items:center; border:1px solid rgba(242,211,142,.65); border-radius:10px 10px 16px 16px; font-family:Georgia,serif; font-size:14px; letter-spacing:0; }.eyebrow { margin:42px 0 14px; color:#dfc17f; font-size:12px; font-weight:700; letter-spacing:.2em; } h1 { max-width:560px; margin:0; font-family:Georgia,"Times New Roman",serif; font-size:clamp(42px,5.1vw,68px); font-weight:500; line-height:1.04; letter-spacing:-.035em; }.lead { max-width:470px; margin:24px 0 0; color:var(--muted); font-size:16px; line-height:1.8; }.trust-list { display:grid; gap:13px; margin:38px 0 0; padding:0; list-style:none; color:#d6d0d7; font-size:14px; }.trust-list li { display:flex; gap:12px; align-items:center; }.check { width:22px; height:22px; flex:0 0 auto; display:grid; place-items:center; border:1px solid rgba(233,199,125,.45); border-radius:50%; color:#efcf87; font-size:12px; }
    .account-card { position:relative; isolation:isolate; width:100%; padding:clamp(25px,4vw,42px); overflow:hidden; border:1px solid var(--line); border-radius:24px; background:var(--panel); box-shadow:0 28px 90px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.08); backdrop-filter:blur(20px); }.account-card::before { content:""; position:absolute; z-index:-1; top:-110px; right:-90px; width:250px; height:250px; border-radius:50%; background:radial-gradient(circle,rgba(234,198,119,.14),transparent 68%); }.card-kicker { margin:0 0 8px; color:#d9b86e; font-size:11px; font-weight:800; letter-spacing:.17em; }h2 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:30px; font-weight:500; }.card-copy { min-height:42px; margin:10px 0 24px; color:var(--muted); font-size:13px; line-height:1.6; }
    .mode-switch { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:24px; padding:4px; border:1px solid rgba(220,211,193,.14); border-radius:12px; background:rgba(3,3,9,.27); }.mode-tab { min-height:42px; border:0; border-radius:8px; color:#bcb5c2; background:transparent; font:inherit; font-size:14px; font-weight:750; cursor:pointer; }.mode-tab:hover:not(.is-active) { color:var(--ink); background:rgba(255,255,255,.05); }.mode-tab:focus-visible,a:focus-visible,.submit:focus-visible { outline:3px solid rgba(233,199,125,.48); outline-offset:3px; }.mode-tab.is-active { color:#21170a; background:linear-gradient(135deg,#efd58f,#bd8738); box-shadow:0 5px 16px rgba(0,0,0,.22); }form { display:grid; gap:16px; }form[hidden] { display:none !important; }label { display:grid; gap:8px; color:#dfd9d4; font-size:13px; font-weight:650; }.field-note { margin-left:5px; color:#918997; font-size:11px; font-weight:500; }.terms-agree { display:flex; align-items:center; gap:8px; color:#c6bfcb; font-size:12px; font-weight:500; line-height:1.5; }.terms-agree input { width:auto; min-height:auto; margin:0; flex:0 0 auto; }.terms-agree a { color:var(--gold); text-decoration:underline; }input { width:100%; min-height:47px; border:1px solid rgba(221,211,190,.25); border-radius:10px; padding:12px 13px; color:#fffaf0; background:rgba(4,4,10,.4); font:inherit; outline:none; transition:border-color .16s ease,box-shadow .16s ease,background .16s ease; }input::placeholder { color:#766f7b; }input:focus { border-color:var(--gold); background:rgba(4,4,10,.68); box-shadow:0 0 0 3px rgba(233,199,125,.15); }.submit { min-height:49px; margin-top:5px; border:1px solid #f1d389; border-radius:10px; color:#26190a; background:linear-gradient(135deg,#f2d78e,#bd8736); box-shadow:0 8px 20px rgba(145,95,23,.2); font:inherit; font-weight:800; cursor:pointer; transition:transform .16s ease,filter .16s ease; }.submit:hover:not(:disabled) { filter:brightness(1.06); transform:translateY(-1px); }.submit:disabled { cursor:wait; opacity:.55; }.status { min-height:22px; margin:1px 0 0; color:#c6bfcb; font-size:13px; line-height:1.5; }.status.error { color:var(--danger); }.status.success { color:var(--success); }.support { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:25px; font-size:12px; }a { color:#e5c67e; text-decoration-color:rgba(229,198,126,.4); text-underline-offset:3px; }a:hover { color:#ffdda0; }.privacy { margin:24px 0 0; padding-top:18px; border-top:1px solid rgba(222,213,194,.13); color:#8f8994; font-size:11px; line-height:1.65; }
    @media (max-width:820px) { .shell { grid-template-columns:1fr; gap:24px; padding:28px 20px 36px; }.welcome { max-width:none; }.eyebrow { margin-top:26px; }.trust-list { display:none; }.account-card { max-width:560px; } } @media (max-width:560px) { .shell { padding:18px 14px 28px; }.welcome { padding:4px 5px; }.brand { font-size:10px; }.brand-mark { width:30px; height:30px; }.eyebrow { margin:21px 0 9px; font-size:10px; }h1 { font-size:clamp(36px,12vw,48px); }.lead { margin-top:14px; font-size:14px; line-height:1.65; }.account-card { padding:24px 20px; border-radius:19px; }h2 { font-size:27px; }.card-copy { margin-bottom:18px; }.mode-switch { margin-bottom:20px; } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="welcome" aria-labelledby="pageTitle"><div class="brand"><span class="brand-mark" aria-hidden="true">角</span>角色世界</div><p class="eyebrow">你的故事，从这里续写</p><h1 id="pageTitle">回到属于你的角色世界</h1><p class="lead">登录后即可继续访问角色、会话与 Memory Books。每个账户拥有独立的创作空间。</p><ul class="trust-list" aria-label="账户安全说明"><li><span class="check" aria-hidden="true">✓</span>仅使用当前同源 HTTPS 安全会话</li><li><span class="check" aria-hidden="true">✓</span>密码仅用于本次请求，不在浏览器中保存</li><li><span class="check" aria-hidden="true">✓</span>新账户默认是普通账户</li></ul></section>
    <section class="account-card" aria-labelledby="accountTitle"><p class="card-kicker">ACCOUNT PORTAL</p><h2 id="accountTitle">欢迎回来</h2><p id="modeCopy" class="card-copy">输入你的档案名和密钥，继续上一次旅程。</p><div class="mode-switch" role="tablist" aria-label="账户操作"><button class="mode-tab is-active" id="loginTab" type="button" role="tab" aria-selected="true" aria-controls="loginForm">登录</button><button class="mode-tab" id="registerTab" type="button" role="tab" aria-selected="false" aria-controls="registerForm">注册账户</button></div>
      <form id="loginForm" novalidate><label for="userHandle">档案名<input id="userHandle" name="handle" autocomplete="username" required autofocus maxlength="32" placeholder="输入你的档案名"></label><label for="userPassword">密钥<input id="userPassword" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="输入你的密钥"></label><button class="submit" id="loginButton" type="submit" disabled>进入魔法世界</button><p id="loginStatus" class="status" role="status" aria-live="polite"></p></form>
      <form id="registerForm" novalidate hidden><label for="regHandle">档案名 <span class="field-note">字母、数字或连字符</span><input id="regHandle" name="handle" autocomplete="username" maxlength="32" placeholder="例如: luna-lovegood"></label><label for="regName">显示名 <span class="field-note">可选</span><input id="regName" name="name" autocomplete="nickname" maxlength="64" placeholder="默认使用档案名"></label><label for="regPassword">设置密钥 <span class="field-note">至少 8 个字符</span><input id="regPassword" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="至少 8 个字符"></label><label for="regConfirm">确认密钥<input id="regConfirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="再次输入密钥"></label><label class="terms-agree" for="regTerms"><input id="regTerms" name="terms" type="checkbox" required>我已阅读并同意<a href="terms.html" target="_blank" rel="noopener">《服务条款与免责声明》</a></label><button class="submit" id="registerButton" type="submit" disabled>创建并进入</button><p id="registerStatus" class="status" role="status" aria-live="polite"></p></form>
      <nav class="support" aria-label="辅助链接"><a href="#" id="backToHomeLink">返回工作台</a><a href="terms.html" target="_blank" rel="noopener">服务条款与免责声明</a></nav><p class="privacy">密码只在本次提交时交给服务端接口；页面不会保存、记录或回显密码，也不会写入 localStorage。公开注册规则、密码长度和账户上限由服务端统一执行。</p>
    </section>
  </main>
  <script src="product-routing.js"></script>
  <script>
    (() => { "use strict";
      const loginForm=document.querySelector("#loginForm"),registerForm=document.querySelector("#registerForm"),handleInput=document.querySelector("#userHandle"),passwordInput=document.querySelector("#userPassword"),loginButton=document.querySelector("#loginButton"),loginStatus=document.querySelector("#loginStatus"),registerButton=document.querySelector("#registerButton"),registerStatus=document.querySelector("#registerStatus"),loginTab=document.querySelector("#loginTab"),registerTab=document.querySelector("#registerTab"),accountTitle=document.querySelector("#accountTitle"),modeCopy=document.querySelector("#modeCopy"),safeHost=["localhost","127.0.0.1","[::1]"].includes(window.location.hostname); let csrfToken="",currentMode="login";
      function setStatus(node,message,kind="") { node.textContent=message; node.classList.toggle("error",kind==="error"); node.classList.toggle("success",kind==="success"); }
      function clearRegisterSecrets() { document.querySelector("#regPassword").value=""; document.querySelector("#regConfirm").value=""; }
      function switchMode(mode) { currentMode=mode==="register"?"register":"login"; const isRegister=currentMode==="register"; loginForm.hidden=isRegister; registerForm.hidden=!isRegister; loginTab.classList.toggle("is-active",!isRegister); registerTab.classList.toggle("is-active",isRegister); loginTab.setAttribute("aria-selected",String(!isRegister)); registerTab.setAttribute("aria-selected",String(isRegister)); accountTitle.textContent=isRegister?"创建你的账户":"欢迎回来"; modeCopy.textContent=isRegister?"账户创建后会直接尝试登录；你也可以随时返回登录。":"输入你的档案名和密钥，继续上一次旅程。"; loginButton.disabled=isRegister||!csrfToken; registerButton.disabled=!isRegister||!csrfToken; setStatus(isRegister?registerStatus:loginStatus,""); (isRegister?document.querySelector("#regHandle"):handleInput).focus(); }
      async function loadCsrf() { if(window.location.protocol!=="https:"&&!safeHost) { setStatus(loginStatus,"请通过 HTTPS 打开登录页。","error"); return; } try { const response=await fetch("/csrf-token",{credentials:"same-origin",cache:"no-store"}); if(!response.ok) throw new Error("csrf unavailable"); const data=await response.json(); if(!data||typeof data.token!=="string"||!data.token) throw new Error("csrf missing"); csrfToken=data.token; loginButton.disabled=currentMode!=="login"; registerButton.disabled=currentMode!=="register"; setStatus(loginStatus,"安全连接已就绪。",""); } catch(_) { csrfToken=""; loginButton.disabled=true; registerButton.disabled=true; setStatus(loginStatus,"登录服务暂不可用，请稍后重试。","error"); } }
      function registrationErrorLabel(code) { const map={REGISTRATION_DISABLED:"公开注册当前已关闭，请联系管理员。",MISSING_FIELDS:"请填写档案名和密钥。",HANDLE_TOO_LONG:"档案名过长。",NAME_TOO_LONG:"显示名过长。",PASSWORD_TOO_SHORT:"密钥至少需要 8 个字符。",PASSWORD_TOO_LONG:"密钥过长。",INVALID_HANDLE:"档案名仅支持字母、数字和连字符。",HANDLE_TAKEN:"该档案名已被占用。",ACCOUNT_LIMIT_REACHED:"账号数量已达上限。",RATE_LIMITED:"操作过于频繁，请稍后再试。"}; return map[code]||"注册失败，请重试。"; }
      async function performLogin(handle,password) { const response=await fetch("/api/users/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({handle,password})}); const data=response.ok?await response.json().catch(()=>null):null; if(!response.ok||!data||typeof data.handle!=="string"||!data.handle) throw new Error("login failed"); return true; }
      loginForm.addEventListener("submit",async event=>{ event.preventDefault(); const handle=String(handleInput.value||"").trim(),password=String(passwordInput.value||""); if(!csrfToken||!handle||!password) { setStatus(loginStatus,"请填写档案名和密钥。","error"); return; } loginButton.disabled=true; loginButton.textContent="正在验证…"; setStatus(loginStatus,"正在安全验证登录信息。",""); try { await performLogin(handle,password); passwordInput.value=""; window.location.replace(window.TASK31_ROUTING.productHomeUrl()); } catch(_) { passwordInput.value=""; loginButton.disabled=false; loginButton.textContent="进入魔法世界"; setStatus(loginStatus,"登录未完成，请检查档案名或密钥。","error"); } });
      registerForm.addEventListener("submit",async event=>{ event.preventDefault(); const handle=String(document.querySelector("#regHandle").value||"").trim(),name=String(document.querySelector("#regName").value||"").trim(),password=String(document.querySelector("#regPassword").value||""),confirm=String(document.querySelector("#regConfirm").value||""); if(!csrfToken||!handle||!password) { setStatus(registerStatus,"请填写档案名和密钥。","error"); return; } if(!document.querySelector("#regTerms").checked) { setStatus(registerStatus,"请先阅读并同意《服务条款与免责声明》。","error"); document.querySelector("#regTerms").focus(); return; } if(password!==confirm) { clearRegisterSecrets(); setStatus(registerStatus,"两次输入的密钥不一致，请重新输入。","error"); document.querySelector("#regPassword").focus(); return; } registerButton.disabled=true; registerButton.textContent="正在创建…"; setStatus(registerStatus,"正在创建账户。",""); try { const response=await fetch("/api/users/register",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRF-Token":csrfToken},body:JSON.stringify({handle,name,password})}); const data=await response.json().catch(()=>null); if(!response.ok||!data||typeof data.handle!=="string"||!data.handle) throw new Error(data&&data.error?data.error:"register failed"); clearRegisterSecrets(); setStatus(registerStatus,"账户已创建，正在安全登录…","success"); try { await performLogin(data.handle,password); window.location.replace(window.TASK31_ROUTING.productHomeUrl()); } catch(_) { registerButton.disabled=false; registerButton.textContent="创建并进入"; switchMode("login"); handleInput.value=data.handle; setStatus(loginStatus,"账户已创建，但登录未完成，请重新输入密钥。","error"); } } catch(error) { clearRegisterSecrets(); registerButton.disabled=false; registerButton.textContent="创建并进入"; setStatus(registerStatus,registrationErrorLabel(error&&error.message?error.message:""),"error"); } });
      function handleTabKeydown(event) { if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key)) return; event.preventDefault(); const next=event.key==="ArrowLeft"||event.key==="Home"?"login":"register"; switchMode(next); (next==="login"?loginTab:registerTab).focus(); } loginTab.addEventListener("click",()=>switchMode("login")); registerTab.addEventListener("click",()=>switchMode("register")); loginTab.addEventListener("keydown",handleTabKeydown); registerTab.addEventListener("keydown",handleTabKeydown); document.querySelector("#backToHomeLink")?.addEventListener("click",(event)=>{ event.preventDefault(); window.location.href=window.TASK31_ROUTING.productHomeUrl(); }); loadCsrf();
    })();
  </script>
</body>
</html>
